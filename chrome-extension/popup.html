<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Deadbird</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      width: 380px;
      min-height: 120px;
      max-height: 560px;
      font-family: -apple-system, 'Inter', BlinkMacSystemFont, sans-serif;
      background: #0a0a0f;
      color: #f0f0f8;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    /* ─── Header ─────────────────────────────── */
    .header {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 14px 16px;
      border-bottom: 1px solid rgba(255,255,255,0.07);
      flex-shrink: 0;
    }
    .header-logo { font-size: 18px; }
    .header-title { font-size: 15px; font-weight: 700; letter-spacing: -0.03em; }
    .header-right { margin-left: auto; display: flex; align-items: center; gap: 8px; }
    .status-dot {
      width: 7px; height: 7px; border-radius: 50%;
    }
    .status-dot.green { background: #22c55e; box-shadow: 0 0 6px #22c55e80; }
    .status-dot.red   { background: #ef4444; }
    .count-badge {
      font-size: 11px; font-weight: 600; color: #888;
    }
    .lang-toggle {
      display: flex; align-items: center; gap: 2px;
      background: rgba(255,255,255,0.05); border-radius: 7px; padding: 2px;
    }
    .lang-btn {
      padding: 3px 7px; border-radius: 5px; border: none; cursor: pointer;
      font-size: 10px; font-weight: 700; color: #555; background: transparent;
      transition: all 0.15s;
    }
    .lang-btn.active { background: #e8a838; color: #0a0a0f; }
    .lang-btn:not(.active):hover { color: #aaa; }
    .back-btn {
      background: none; border: none; cursor: pointer;
      color: #e8a838; font-size: 13px; font-weight: 600;
      display: flex; align-items: center; gap: 4px; padding: 0;
    }
    .back-btn:hover { opacity: 0.8; }
    .detail-title {
      font-size: 12px; color: #888; flex: 1;
      overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
      margin-left: 10px; text-align: right;
    }

    /* ─── Scrollable body ─────────────────────── */
    .body {
      flex: 1;
      overflow-y: auto;
      overflow-x: hidden;
      scrollbar-width: thin;
      scrollbar-color: rgba(255,255,255,0.1) transparent;
    }
    .body::-webkit-scrollbar { width: 4px; }
    .body::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.1); border-radius: 4px; }

    /* ─── Footer ─────────────────────────────── */
    .footer {
      padding: 10px 16px;
      border-top: 1px solid rgba(255,255,255,0.07);
      flex-shrink: 0;
    }
    .footer-btn {
      width: 100%; padding: 9px; border-radius: 10px;
      background: rgba(232,168,56,0.1); border: 1px solid rgba(232,168,56,0.2);
      color: #e8a838; font-size: 12px; font-weight: 600; cursor: pointer;
      transition: background 0.15s;
    }
    .footer-btn:hover { background: rgba(232,168,56,0.18); }

    /* ─── Loading / Empty states ──────────────── */
    .center-state {
      display: flex; flex-direction: column; align-items: center;
      justify-content: center; padding: 36px 24px; gap: 10px;
      text-align: center;
    }
    .center-state .icon { font-size: 32px; opacity: 0.6; }
    .center-state .title { font-size: 14px; font-weight: 600; color: #d0d0e0; }
    .center-state .sub { font-size: 12px; color: #666; line-height: 1.5; }

    .spinner {
      width: 22px; height: 22px; border-radius: 50%;
      border: 2px solid rgba(232,168,56,0.2);
      border-top-color: #e8a838;
      animation: spin 0.7s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ─── Video list ──────────────────────────── */
    .video-list { padding: 10px 12px; display: flex; flex-direction: column; gap: 8px; }

    .video-card {
      display: flex; align-items: center; gap: 10px;
      background: #14141f; border: 1px solid rgba(255,255,255,0.06);
      border-radius: 12px; padding: 10px; cursor: default;
      transition: border-color 0.15s;
    }
    .video-card:hover { border-color: rgba(255,255,255,0.12); }

    .video-thumb {
      width: 88px; height: 50px; border-radius: 7px;
      object-fit: cover; background: #1a1a2a; flex-shrink: 0;
      position: relative;
    }
    .video-thumb.netflix-thumb {
      display: flex; align-items: center; justify-content: center;
      background: linear-gradient(135deg, #1a1a2a 0%, #2a1a1a 100%);
      border: 1px solid rgba(229, 9, 20, 0.2);
    }
    .platform-badge {
      position: absolute; top: 4px; left: 4px;
      width: 16px; height: 16px; border-radius: 4px;
      font-size: 9px; font-weight: 700;
      display: flex; align-items: center; justify-content: center;
    }
    .platform-badge.youtube {
      background: #ff0000; color: white;
    }
    .platform-badge.netflix {
      background: #e50914; color: white;
    }
    .netflix-thumb .platform-badge {
      position: static; width: 28px; height: 28px;
      font-size: 14px; border-radius: 6px;
    }

    .video-meta { flex: 1; min-width: 0; }
    .video-title-text {
      font-size: 12px; font-weight: 500; color: #e0e0f0;
      display: -webkit-box; -webkit-line-clamp: 2;
      -webkit-box-orient: vertical; overflow: hidden;
      line-height: 1.4;
    }
    .video-id-text { font-size: 10px; color: #444; margin-top: 3px; }

    .words-btn {
      flex-shrink: 0;
      padding: 6px 10px; border-radius: 8px;
      background: rgba(232,168,56,0.1); border: 1px solid rgba(232,168,56,0.2);
      color: #e8a838; font-size: 11px; font-weight: 700; cursor: pointer;
      white-space: nowrap; transition: background 0.15s;
    }
    .words-btn:hover { background: rgba(232,168,56,0.2); }
    .words-btn:disabled { opacity: 0.4; cursor: not-allowed; }

    /* ─── Word cards ──────────────────────────── */
    .words-header {
      padding: 12px 16px 4px;
      font-size: 11px; font-weight: 700; color: #555; text-transform: uppercase; letter-spacing: 0.06em;
    }

    .words-list { padding: 4px 12px 12px; display: flex; flex-direction: column; gap: 6px; }

    .word-card {
      background: #14141f; border-radius: 12px;
      padding: 12px 14px; border-left: 3px solid rgba(232,168,56,0.5);
      transition: transform 0.1s;
    }
    .word-card:hover { transform: translateX(2px); }

    .word-row { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; margin-bottom: 4px; }

    .word-korean { font-size: 17px; font-weight: 700; color: #f0f0f8; letter-spacing: -0.01em; }

    .word-rank {
      font-size: 10px; font-weight: 600; color: #444;
      flex-shrink: 0;
    }

    .word-english { font-size: 13px; color: #a0a0c0; font-weight: 500; margin-bottom: 5px; }

    .word-sentence {
      font-size: 11px; color: #4a4a6a; line-height: 1.5;
      border-top: 1px solid rgba(255,255,255,0.05); padding-top: 6px; margin-top: 4px;
    }
    .word-sentence .ko { color: #5a5a7a; }
    .word-sentence .en { color: #3a3a5a; }

    /* ─── Audio button ────────────────────────── */
    .audio-btn {
      background: rgba(232,168,56,0.15);
      border: 1px solid rgba(232,168,56,0.3);
      border-radius: 6px;
      padding: 4px 8px;
      font-size: 10px;
      font-weight: 600;
      color: #e8a838;
      cursor: pointer;
      transition: all 0.15s;
      margin-right: 8px;
    }
    .audio-btn:hover {
      background: rgba(232,168,56,0.25);
      border-color: rgba(232,168,56,0.5);
    }
    .audio-badge {
      margin-right: 8px;
      font-size: 12px;
    }
    .audio-badge.enabled {
      color: #22c55e;
    }

    /* ─── Delete button ──────────────────────────── */
    .delete-btn {
      flex-shrink: 0;
      width: 28px; height: 28px;
      border-radius: 6px;
      background: transparent;
      border: 1px solid transparent;
      color: #555;
      cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      transition: all 0.15s;
    }
    .delete-btn:hover {
      background: rgba(239, 68, 68, 0.1);
      border-color: rgba(239, 68, 68, 0.3);
      color: #ef4444;
    }
    .delete-btn svg {
      width: 14px; height: 14px;
    }

    /* ─── Delete confirmation dialog ──────────────── */
    .dialog-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.7);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
      z-index: 100;
    }
    .dialog {
      background: #14141f;
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 16px;
      padding: 20px;
      max-width: 300px;
      width: 100%;
    }
    .dialog-icon {
      width: 44px; height: 44px;
      border-radius: 50%;
      background: rgba(239, 68, 68, 0.1);
      display: flex; align-items: center; justify-content: center;
      margin-bottom: 14px;
    }
    .dialog-icon svg {
      width: 22px; height: 22px;
      color: #ef4444;
    }
    .dialog-title {
      font-size: 15px;
      font-weight: 600;
      color: #f0f0f8;
      margin-bottom: 6px;
    }
    .dialog-text {
      font-size: 12px;
      color: #666;
      line-height: 1.5;
      margin-bottom: 16px;
    }
    .dialog-video-title {
      color: #888;
      font-weight: 500;
    }
    .dialog-actions {
      display: flex;
      gap: 10px;
    }
    .dialog-btn {
      flex: 1;
      padding: 10px;
      border-radius: 10px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.15s;
    }
    .dialog-btn.cancel {
      background: rgba(255,255,255,0.05);
      border: 1px solid rgba(255,255,255,0.1);
      color: #888;
    }
    .dialog-btn.cancel:hover {
      background: rgba(255,255,255,0.1);
      color: #aaa;
    }
    .dialog-btn.delete {
      background: #ef4444;
      border: none;
      color: white;
    }
    .dialog-btn.delete:hover {
      background: #dc2626;
    }
    .dialog-btn:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }
  </style>
</head>
<body>
  <div id="root"></div>
  <script src="popup.js"></script>
</body>
</html>
